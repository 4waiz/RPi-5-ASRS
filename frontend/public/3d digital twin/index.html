<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASRS Crane Controller</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="container3D"></div>
  
  <!-- Control Panel -->
  <div class="control-panel">
    <div class="panel-title">Select Box</div>
    <div class="box-list" id="boxList"></div>
    <div class="action-buttons">
      <button id="getBoxOutBtn" disabled>Get Out</button>
      <button id="putBoxInBtn" disabled>Put In</button>
    </div>
  </div>
  
  <!-- Status Label -->
  <div class="status-label">
    <div class="status-item">
      <div class="color1"> </div>
      <div class="status-count full" id="fullCount">0</div>
      <div class="status-text">: Full</div>
    </div>
    <div class="status-item">
      <div class="color2"> </div>
      <div class="status-count partial" id="partialCount">0</div>
      <div class="status-text">: Partially full.</div>
    </div>
    <div class="status-item">
      <div class="color3"> </div>
      <div class="status-count empty" id="emptyCount">0</div>
      <div class="status-text">Empty</div>
    </div>
  </div>
  
  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
