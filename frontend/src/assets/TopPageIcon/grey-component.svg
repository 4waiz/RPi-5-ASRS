  <!-- Connection pins (left) -->
  <path d="M7 9H4M7 12H4M7 15H4" stroke="#525252" stroke-width="2" stroke-linecap="round"/>
  <!-- Connection pins (right) -->
  <path d="M17 9H20M17 12H20M17 15H20" stroke="#525252" stroke-width="2" stroke-linecap="round"/>
  <!-- Connection pins (top) -->
  <path d="M9 7V4M12 7V4M15 7V4" stroke="#525252" stroke-width="2" stroke-linecap="round"/>
  <!-- Connection pins (bottom) -->
  <path d="M9 17V20M12 17V20M15 17V20" stroke="#525252" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="12" cy="12" r="1.5" fill="#525252"/>
</svg>
